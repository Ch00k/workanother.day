{# Outside the KSeF block: every contract is billed to someone, wherever it is worked from. #}
<div class="sm:col-span-2">
    <label for="buyer" class="block text-sm font-medium text-[#666] mb-1">Buyer</label>
    <select id="buyer" name="buyer"
            class="w-full rounded-[10px] border border-[#ddd] px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#999]/30 focus:border-[#999]">
        <option value="">Not set</option>
        {% for option in buyers %}
        <option value="{{ option.pk }}" {% if option.pk|stringformat:"s" == selected_buyer %}selected{% endif %}>
            {{ option.name }}{% if option.tax_id %} &middot; {{ option.country }} {{ option.tax_id }}{% endif %}
        </option>
        {% endfor %}
    </select>
    <div class="text-xs text-[#999] mt-1">
        The client these invoices are billed to. Its details fill the Billed to block, and
        KSeF identifies it by the tax identifier held against it.
    </div>
</div>
