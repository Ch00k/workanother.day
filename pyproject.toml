[project]
name = "wad"
version = "0.1.0"
description = "workanother.day"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0",
    "django>=6.0.3",
    "gunicorn>=25.3.0",
    "httpx>=0.28.1",
    "ksef2>=0.18.1",
    "lxml>=6.1.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.2",
    "lxml-stubs>=0.5.1",
    "pytest>=9.0.2",
    "pytest-django>=4.14.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["wad/tests"]
# Everything else is answered by the stand-in in wad/tests/http.py.
markers = ["live: reaches a real server rather than the stand-in"]
# A mistyped or dropped marker would otherwise only warn, and a test that quietly
# stopped being live would still pass against the pinned copy. --strict-markers is
# the usual way to say this, but pytest 9.0.2 only honours it from the command line.
filterwarnings = ["error::pytest.PytestUnknownMarkWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "D", # Docstrings
    "COM812",
    "TD",
    "TRY003",
    "EM101",
    "C901",
    "PLC0415",
    "PLR2004",
    "PLR0912",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",
    "S105", # Fake credentials compared against token fields
    "S106", # Fake credentials passed to token arguments
    "SLF001", # Unit-testing internal helpers
]
"**/migrations/**" = ["RUF012"]
