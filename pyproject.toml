[project]
name = "wad"
version = "0.1.0"
description = "workanother.day"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0",
    "django>=6.1",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "ksef2>=0.18.1",
    "lxml>=6.1.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "lxml-stubs>=0.5.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["wad/tests"]
# Everything else is answered by the stand-in in wad/tests/http.py.
markers = ["live: reaches a real server rather than the stand-in"]
# A mistyped or dropped marker would otherwise only warn, and a test that quietly
# stopped being live would still pass against the pinned copy.
strict_markers = true
# An unrecognised key in this section is otherwise ignored, which would let a
# misspelled strict_markers switch off the guard above without a word.
strict_config = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "D", # Docstrings
    "COM812",
    "CPY001", # Copyright notices
    "TD",
    "TRY003",
    "EM101",
    "C901",
    "PLC0415",
    "PLR2004",
    "PLR0912",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",
    "S105", # Fake credentials compared against token fields
    "S106", # Fake credentials passed to token arguments
    "SLF001", # Unit-testing internal helpers
]
"**/migrations/**" = ["RUF012"]
