name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The deploy job requires a tag ref, so pushes to main and PRs only lint, and a
# workflow_dispatch from a branch is lint-only: production only ever deploys
# from a release tag.
jobs:
  lint:
    runs-on: ubuntu-latest
    # The keys are required outside DEBUG, so CI supplies throwaway ones rather than
    # letting settings fall back to something a real deployment could inherit. Set on the
    # job because Actions does not read YAML anchors, and every step below needs them.
    env:
      DJANGO_SECRET_KEY: ci-only-key-4Xn7QpZm2LwVtR9sHgKdBjF6yCeA3uNiPoTr8ZxWqMvSbE5D
      DJANGO_KSEF_TOKEN_KEY: rXevUkBPASjAGdFZDd0mIj-SukHMTv-SxRKx1uGmbCY=
      # The tests that print an invoice need a browser to print it with, and skip
      # themselves where there is none. The image ships Chromium; the runner ships
      # Chrome, which takes the same flags, so pointing at it is what makes those
      # tests run here rather than quietly pass by being skipped.
      DJANGO_CHROMIUM_PATH: /usr/bin/google-chrome
      # The KSeF sandbox pair. A token is issued for one NIP in one KSeF, so it cannot live in
      # the repository. The test that issues an invoice there fails rather than skipping when
      # they are missing here, because a skip is a green build: rotated, revoked or simply
      # never passed, and nothing would be exercising the real KSeF with nothing to say so.
      # A pull request from a fork gets no secrets at all and so cannot pass this job.
      KSEF_DEV_TOKEN: ${{ secrets.KSEF_DEV_TOKEN }}
      KSEF_DEV_NIP: ${{ secrets.KSEF_DEV_NIP }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run manage.py collectstatic --noinput
      # The deploy checks read the settings a real deployment would run under, so this step
      # supplies the ones a deployment gets and the rest of the job has no use for. A mail
      # server is among them: without one the settings fall back to printing messages, which
      # the deploy checks reject as a backend that delivers nothing. Nothing connects here,
      # so the address only has to be one.
      - run: uv run manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_ALLOWED_HOSTS: workanother.day
          DJANGO_EMAIL_HOST: smtp.example.com
          DJANGO_EMAIL_USER: ci@example.com
          DJANGO_EMAIL_PASSWORD: ci-only-password
      - run: uv run pytest

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: lint
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/setup-buildx-action@v4

      # Build in the runner (not Fly's builder). load:true puts the image in the
      # local Docker daemon so we can push it after authenticating, and gha cache
      # reuses layers across runs.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: registry.fly.io/workanotherday:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Authenticate right before pushing: fly auth docker tokens expire in ~5 min,
      # so doing it after the (slow) build avoids an expired-token push failure.
      - name: Push image to Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker
          docker push registry.fly.io/workanotherday:${{ github.ref_name }}

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --app workanotherday --image registry.fly.io/workanotherday:${{ github.ref_name }}
